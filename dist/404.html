<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Ayur-Seva</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9fafb;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 500px;
            padding: 2rem;
        }
        .logo {
            color: #059669;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }
        h1 {
            color: #1f2937;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        p {
            color: #6b7280;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .btn {
            background-color: #059669;
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            text-decoration: none;
            display: inline-block;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #047857;
        }
    </style>
    <script>
        // Redirect to home page after 3 seconds
        setTimeout(function() {
            window.location.href = '/';
        }, 3000);
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">🌿 Ayur-Seva</div>
        <h1>Page Not Found</h1>
        <p>The page you're looking for doesn't exist or has been moved. You'll be redirected to the home page in 3 seconds.</p>
        <a href="/" class="btn">Go to Home Page</a>
    </div>
</body>
</html>
